<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentius</title>
    <meta name="description" content="Agentius deploys governed agentic operations for high-consequence workflows.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
        const storedLanguage = localStorage.getItem("agentius_language");
        const browserLanguage = navigator.language || navigator.userLanguage || "";
        const targetLanguage = storedLanguage || (browserLanguage.toLowerCase().startsWith("en") ? "en" : "es");
        window.location.replace(`/${targetLanguage}/`);
    </script>
</head>
<body>
    <p>
        <a href="/es/">Español</a>
        <a href="/en/">English</a>
    </p>
</body>
</html>
