<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agentius</title>
    <meta name="description" content="Agentius deploys governed agentic operations for high-consequence workflows.">
    <link rel="icon" href="/favicon.svg" type="image/svg+xml">
    <script>
        const storedLanguage = localStorage.getItem("agentius_language");
        const browserLanguage = navigator.language || navigator.userLanguage || "";
        const targetLanguage = storedLanguage || (browserLanguage.toLowerCase().startsWith("en") ? "en" : "es");
        window.location.replace(`/${targetLanguage}/`);
    </script>
    <meta property="og:locale" content="en_US">
    <link rel="canonical" href="https://agentius.ai/">
    <link rel="alternate" hreflang="en" href="https://agentius.ai/en/">
    <link rel="alternate" hreflang="es-MX" href="https://agentius.ai/es/">
    <link rel="alternate" hreflang="x-default" href="https://agentius.ai/">
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "@id": "https://agentius.ai/#organization",
      "name": "Agentius",
      "url": "https://agentius.ai/",
      "description": "Operational AI deployment partner for governed agentic operations.",
      "address": {
        "@type": "PostalAddress",
        "addressLocality": "Mexico City",
        "addressRegion": "CDMX",
        "addressCountry": "MX"
      },
      "areaServed": [
        {
          "@type": "Country",
          "name": "Mexico"
        },
        {
          "@type": "Country",
          "name": "United States"
        },
        {
          "@type": "Place",
          "name": "Europe"
        }
      ]
    }
    </script>
</head>
<body>
    <p>
        <a href="/es/">Español</a>
        <a href="/en/">English</a>
    </p>
</body>
</html>
